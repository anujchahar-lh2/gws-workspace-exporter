<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWS Exporter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .file-upload {
            position: relative;
            display: block;
            padding: 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .file-upload:hover {
            border-color: #764ba2;
            background: #efefff;
        }

        .file-upload input {
            display: none;
        }

        .file-upload-text {
            color: #667eea;
            font-size: 14px;
            font-weight: 500;
        }

        .file-name {
            color: #28a745;
            font-size: 12px;
            margin-top: 8px;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .email-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .email-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
        }

        .email-item button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s ease;
        }

        .email-item button:hover {
            background: #c82333;
        }

        .date-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .add-email-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s ease;
            width: fit-content;
        }

        .add-email-btn:hover {
            background: #764ba2;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .start-btn {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-section {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .progress-section.show {
            display: block;
        }

        .progress-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .progress-stats {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .completion-message {
            display: none;
            padding: 16px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            color: #155724;
            margin-top: 16px;
            font-size: 14px;
        }

        .completion-message.show {
            display: block;
        }

        .error-message {
            display: none;
            padding: 16px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            color: #721c24;
            margin-top: 16px;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .form-section {
            display: block;
        }

        .form-section.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        input[type="text"].email-input {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Google Workspace Exporter</h1>
            <p>Extract Drive files and Gmail data easily</p>
        </div>

        <div class="form-section" id="formSection">
            <form id="extractionForm">
                <!-- File Upload -->
                <div class="form-group">
                    <label>Service Account JSON</label>
                    <label class="file-upload" id="fileLabel">
                        <input type="file" id="jsonFile" accept=".json" required>
                        <span class="file-upload-text">📁 Click to upload or drag & drop</span>
                        <div class="file-name" id="fileName"></div>
                    </label>
                </div>

                <!-- Admin Email -->
                <div class="form-group">
                    <label>Admin Email *</label>
                    <input type="text" id="adminEmail" placeholder="admin@company.com" required>
                </div>

                <!-- Employee Emails -->
                <div class="form-group">
                    <label>Employee Emails to Extract</label>
                    <div class="email-list" id="emailList"></div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="newEmail" class="email-input" placeholder="employee@company.com">
                        <button type="button" class="add-email-btn" id="addEmailBtn">+ Add</button>
                    </div>
                </div>

                <!-- Date Range -->
                <div class="form-group">
                    <label>Date Range (Optional)</label>
                    <div class="date-range">
                        <div>
                            <label style="font-size: 12px; margin-bottom: 4px;">From</label>
                            <input type="date" id="dateFrom" placeholder="2024-01-01">
                        </div>
                        <div>
                            <label style="font-size: 12px; margin-bottom: 4px;">To</label>
                            <input type="date" id="dateTo" placeholder="2024-03-31">
                        </div>
                    </div>
                </div>

                <!-- Start Button -->
                <div class="btn-container">
                    <button type="submit" class="start-btn" id="startBtn">🚀 Start Extraction</button>
                </div>
            </form>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <!-- Progress Section -->
        <div class="progress-section" id="progressSection">
            <div class="progress-title" id="progressTitle">Extracting...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span id="progressPercent">0%</span>
                <span id="progressStatus">Initializing...</span>
            </div>
            <div class="progress-stats" id="progressStats"></div>
            <div class="completion-message" id="completionMessage"></div>
        </div>
    </div>

    <script>
        let emails = [];
        let extractionInProgress = false;

        // File upload
        document.getElementById('jsonFile').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                document.getElementById('fileName').textContent = '✓ ' + e.target.files[0].name;
            }
        });

        // Add email
        document.getElementById('addEmailBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const input = document.getElementById('newEmail');
            const email = input.value.trim();

            if (email && email.includes('@')) {
                emails.push(email);
                input.value = '';
                renderEmails();
            } else {
                showError('Please enter a valid email address');
            }
        });

        function renderEmails() {
            const list = document.getElementById('emailList');
            list.innerHTML = emails.map((email, idx) => `
                <div class="email-item">
                    <span>${email}</span>
                    <button type="button" onclick="removeEmail(${idx})">Remove</button>
                </div>
            `).join('');
        }

        function removeEmail(idx) {
            emails.splice(idx, 1);
            renderEmails();
        }

        // Form submit
        document.getElementById('extractionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const jsonFile = document.getElementById('jsonFile').files[0];
            const adminEmail = document.getElementById('adminEmail').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            // Validation
            if (!jsonFile) {
                showError('Please upload the service account JSON file');
                return;
            }

            if (!adminEmail.includes('@')) {
                showError('Please enter a valid admin email');
                return;
            }

            if (emails.length === 0) {
                showError('Please add at least one employee email');
                return;
            }

            if ((dateFrom && !dateTo) || (!dateFrom && dateTo)) {
                showError('Please specify both start and end dates, or leave both empty');
                return;
            }

            // Start extraction
            startExtraction(jsonFile, adminEmail, emails, dateFrom, dateTo);
        });

        async function startExtraction(jsonFile, adminEmail, employeeEmails, dateFrom, dateTo) {
            extractionInProgress = true;
            document.getElementById('formSection').classList.add('disabled');
            document.getElementById('progressSection').classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');

            try {
                const formData = new FormData();
                formData.append('json_file', jsonFile);
                formData.append('admin_email', adminEmail);
                formData.append('employee_emails', JSON.stringify(employeeEmails));
                if (dateFrom) formData.append('date_from', dateFrom);
                if (dateTo) formData.append('date_to', dateTo);

                // Simulate extraction progress (in real implementation, connect to backend)
                simulateExtraction(employeeEmails);

                // In production, send to backend:
                // const response = await fetch('/api/extract', {
                //     method: 'POST',
                //     body: formData
                // });

            } catch (error) {
                showError('Extraction failed: ' + error.message);
                resetForm();
            }
        }

        function simulateExtraction(emails) {
            let progress = 0;
            let currentUser = 0;
            let emailsProcessed = 0;
            const totalEmails = emails.length * 500; // Simulated

            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 95) progress = 95;

                currentUser = Math.floor((progress / 100) * emails.length);
                emailsProcessed = Math.floor((progress / 100) * totalEmails);

                updateProgress(progress, emails[Math.min(currentUser, emails.length - 1)], emailsProcessed, totalEmails);

                if (progress >= 95) {
                    clearInterval(interval);
                    progress = 100;
                    updateProgress(100, emails[emails.length - 1], totalEmails, totalEmails);
                    completeExtraction(emails);
                }
            }, 800);
        }

        function updateProgress(percent, currentUser, processed, total) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = Math.round(percent) + '%';
            document.getElementById('progressStatus').textContent = currentUser || 'Processing...';
            document.getElementById('progressStats').innerHTML = `
                Gmail: ${processed}/${total} emails<br>
                Elapsed: ${Math.floor(Math.random() * 60)}m ${Math.floor(Math.random() * 60)}s
            `;
        }

        function completeExtraction(emails) {
            document.getElementById('progressTitle').textContent = '✅ Extraction Complete!';
            document.getElementById('completionMessage').innerHTML = `
                <strong>Success!</strong><br>
                Extracted data for ${emails.length} employee(s).<br>
                Data location: <code>/out/</code><br>
                Archive: <code>workspace_export.zip</code>
            `;
            document.getElementById('completionMessage').classList.add('show');

            setTimeout(() => {
                resetForm();
            }, 3000);
        }

        function resetForm() {
            extractionInProgress = false;
            document.getElementById('formSection').classList.remove('disabled');
            document.getElementById('progressSection').classList.remove('show');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressPercent').textContent = '0%';
            document.getElementById('progressTitle').textContent = 'Extracting...';
            document.getElementById('completionMessage').classList.remove('show');
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Enter key for email input
        document.getElementById('newEmail').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('addEmailBtn').click();
            }
        });
    </script>
</body>
</html>
