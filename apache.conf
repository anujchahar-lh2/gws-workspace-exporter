<VirtualHost *:80>
    ServerName your-domain.com  # Replace with your domain
    ServerAdmin admin@your-domain.com

    # Redirect to HTTPS (optional)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName your-domain.com  # Replace with your domain
    ServerAdmin admin@your-domain.com

    # SSL Configuration (uncomment and update paths)
    # SSLEngine on
    # SSLCertificateFile /path/to/certificate.crt
    # SSLCertificateKeyFile /path/to/private.key

    # Proxy settings
    <Proxy *>
        Order allow,deny
        Allow from all
    </Proxy>

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/ timeout=3600
    ProxyPassReverse / http://127.0.0.1:8000/

    # Increase upload size
    LimitRequestBody 104857600  # 100MB

    # Security headers
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-Content-Type-Options "nosniff"
    Header set X-XSS-Protection "1; mode=block"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/gws-exporter-error.log
    CustomLog ${APACHE_LOG_DIR}/gws-exporter-access.log combined
</VirtualHost>
